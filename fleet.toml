]

[packages.runtimes]
claude = ".claude-plugin/plugin.json"
codex = ".codex-plugin/plugin.json"
cursor = ".cursor-plugin/plugin.json"
grok = ".claude-plugin/plugin.json"

[packages.install_ids]
claude = "team@lukeslp-team"
codex = "team@lukeslp-team"
cursor = "team@lukeslp-team"
grok = "team"

[[packages]]
name = "intentional-ux"
directory = "intentional-ux"
version = "0.2.2"
origin = "https://github.com/actually-useful-ai/intentional-ux.git"
ref = "v0.2.2"
hash_paths = [
  "skills",
  ".claude-plugin/plugin.json",
  ".claude-plugin/marketplace.json",
  ".codex-plugin/plugin.json",
  ".cursor-plugin/plugin.json",
]

[packages.runtimes]
claude = ".claude-plugin/plugin.json"
codex = ".codex-plugin/plugin.json"
cursor = ".cursor-plugin/plugin.json"
grok = ".claude-plugin/plugin.json"

[packages.install_ids]
