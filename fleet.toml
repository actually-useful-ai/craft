# These providers are routed by Craft but stay outside the audited release BOM
# until their canonical repositories publish immutable tags.
[[blocked_packages]]
name = "chaos"
version = "1.0.0"
origin = "https://github.com/actually-useful-ai/chaos.git"
status = "missing-immutable-release"

