schema_version = 1
fleet_version = "0.8.1"

[defaults]
checkout_root = "~/plugins"
cursor_installed_roots = ["~/.cursor/plugins/cache"]
backup_root = "~/.local/state/craft/fleet-backups"

[runtime_roots]
claude = ["~/.claude/skills"]
codex = ["~/.agents/skills", "~/.codex/skills"]
cursor = ["~/.cursor/skills"]
grok = ["~/.grok/skills"]

[[packages]]
name = "craft"
directory = "craft"
version = "0.8.1"
origin = "https://github.com/actually-useful-ai/craft.git"
ref = "v0.8.1"
hash_paths = [
  "fleet.toml",
  "skills",
  "agents",
  "scripts",
  ".claude-plugin/plugin.json",
  ".claude-plugin/marketplace.json",
  ".codex-plugin/plugin.json",
  ".cursor-plugin/plugin.json",
  ".cursor-plugin/marketplace.json",
]

[packages.runtimes]
claude = ".claude-plugin/plugin.json"
codex = ".codex-plugin/plugin.json"
cursor = ".cursor-plugin/plugin.json"
grok = ".claude-plugin/plugin.json"

[packages.install_ids]
claude = "craft@lukeslp-craft"
codex = "craft@lukeslp-craft"
cursor = "craft@lukeslp-craft"
grok = "craft"

[[packages]]
name = "team"
directory = "team"
version = "0.1.4"
